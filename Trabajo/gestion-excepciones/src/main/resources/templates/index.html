<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Portal de Acceso - Sistema Distribuido</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/International_Pokémon_logo.svg}">
</head>
<body class="bg-light" style="padding-top: 70px; background-color: #f4f5f7;">

<div th:replace="~{fragmentos :: navbar}"></div>

<div class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 70px);">
    <div class="portal-card" style="background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 90%; border-top: 8px solid #E3350D;">
        <h1 style="color: #2c3e50; font-size: 28px; margin-bottom: 10px; font-weight: bold;">Terminal de Gestión</h1>
        <p style="color: #7f8c8d; margin-bottom: 30px;">Base de Datos Centralizada y Sistema de Diagnóstico de Excepciones</p>

        <a href="/pruebas-api" class="btn btn-warning w-100 fw-bold mb-3 py-2 text-dark">Ingresar al Panel de Control</a>
        <a href="/usuarios" class="btn w-100 fw-bold mb-3 py-2 text-white" style="background-color: #2c3e50;">Mantenimiento de Usuarios</a>
        <a href="/entrenadores" class="btn w-100 fw-bold mb-3 py-2 text-white" style="background-color: #3b4cca;">Gestión de Entrenadores</a>
        <a href="/gimnasios" class="btn w-100 fw-bold mb-3 py-2 text-white" style="background-color: #27ae60;">Gestión de Gimnasios</a>
        <a href="/tienda" class="btn w-100 fw-bold mb-3 py-2 text-white" style="background-color: #8e44ad;"><i class="bi bi-shop"></i> Tienda y Pagos</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-link text-danger text-decoration-none border-0 p-0">Finalizar sesión de usuario</button>
        </form>
    </div>
</div>

<div th:replace="~{fragmentos :: widgets}"></div>

</body>
</html>
