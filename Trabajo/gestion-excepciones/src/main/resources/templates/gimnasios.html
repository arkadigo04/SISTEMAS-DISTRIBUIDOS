<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liga Pokémon - Gestión de Gimnasios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/International_Pokémon_logo.svg}">
</head>
<body class="bg-light" style="padding-top: 70px;">

<div th:replace="~{fragmentos :: navbar}"></div>

<div class="container mt-5">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="fw-bold" style="color: #2c3e50;">Red de Gimnasios</h2>
            <p class="text-muted">Administración de infraestructuras de la Liga (PostgreSQL).</p>
        </div>
        <div class="col-auto">
            <button class="btn btn-success shadow-sm" data-bs-toggle="modal" data-bs-target="#gimnasioModal" onclick="limpiarFormulario()">
                <i class="bi bi-plus-circle-fill"></i> Construir Gimnasio
            </button>
        </div>
    </div>

    <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show shadow-sm">
        <i class="bi bi-check-circle-fill"></i> Sincronización completada: Gimnasio actualizado en la base de datos.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${param.eliminado}" class="alert alert-danger alert-dismissible fade show shadow-sm">
        <i class="bi bi-trash-fill"></i> Infraestructura demolida y eliminada de los registros.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 text-center align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre del Gimnasio</th>
                    <th>Ubicación (Ciudad)</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="gimnasio : ${gimnasios}">
                    <td class="fw-bold text-secondary" th:text="${gimnasio.id}"></td>
                    <td class="fw-bold" th:text="${gimnasio.nombre}"></td>
                    <td><span class="badge bg-info text-dark fs-6"><i class="bi bi-geo-alt-fill"></i> <span th:text="${gimnasio.ciudad}"></span></span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-success"
                                th:data-id="${gimnasio.id}"
                                th:data-nombre="${gimnasio.nombre}"
                                th:data-ciudad="${gimnasio.ciudad}"
                                onclick="cargarFormulario(this.getAttribute('data-id'), this.getAttribute('data-nombre'), this.getAttribute('data-ciudad'))"
                                data-bs-toggle="modal" data-bs-target="#gimnasioModal">
                            <i class="bi bi-pencil-square"></i> Editar
                        </button>

                        <form th:action="@{/gimnasios/eliminar/{id}(id=${gimnasio.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Seguro que deseas destruir los registros de este gimnasio?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash3"></i> Borrar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="gimnasioModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="modalTitle">Nuevo Gimnasio</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/gimnasios/guardar}" method="post">
                <div class="modal-body">
                    <input type="hidden" id="gimnasioId" name="id">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre del Gimnasio</label>
                        <input type="text" class="form-control" id="gimnasioNombre" name="nombre" placeholder="Ej: Gimnasio Celeste" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Ciudad</label>
                        <input type="text" class="form-control" id="gimnasioCiudad" name="ciudad" placeholder="Ej: Ciudad Celeste" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success">Guardar Estructura</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function limpiarFormulario() {
        document.getElementById('modalTitle').innerText = 'Construir Nuevo Gimnasio';
        document.getElementById('gimnasioId').value = '';
        document.getElementById('gimnasioNombre').value = '';
        document.getElementById('gimnasioCiudad').value = '';
    }

    function cargarFormulario(id, nombre, ciudad) {
        document.getElementById('modalTitle').innerText = 'Reformar Gimnasio';
        document.getElementById('gimnasioId').value = id;
        document.getElementById('gimnasioNombre').value = nombre;
        document.getElementById('gimnasioCiudad').value = ciudad;
    }
</script>

<div th:replace="~{fragmentos :: widgets}"></div>

</body>
</html>
