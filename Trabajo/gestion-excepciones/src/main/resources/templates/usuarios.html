<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mantenimiento de Entrenadores - Pokedex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/International_Pokémon_logo.svg}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #E3350D;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-display"></i> Panel Central
        </a>
        <div class="d-flex">
            <a href="/pruebas-api" class="btn btn-warning me-2 fw-bold text-dark">APIs</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row mb-4">
        <div class="col">
            <h2 class="fw-bold" style="color: #2c3e50;">Mantenimiento de Usuarios</h2>
            <p class="text-muted">Gestión de entrenadores registrados en el sistema central.</p>
        </div>
        <div class="col-auto">
            <a href="/register" class="btn btn-success shadow-sm">
                <i class="bi bi-person-plus-fill"></i> Nuevo Entrenador
            </a>
        </div>
    </div>

    <div th:if="${param.eliminado}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill"></i> Usuario eliminado correctamente de la base de datos.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th class="px-4">ID</th>
                    <th>Nombre de Entrenador</th>
                    <th>Pregunta de Seguridad</th>
                    <th class="text-end px-4">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td class="px-4 fw-bold text-secondary" th:text="${usuario.id}"></td>
                    <td th:text="${usuario.username}"></td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${usuario.securityQuestion}"></span>
                    </td>
                    <td class="text-end px-4">
                        <form th:action="@{/usuarios/eliminar/{id}(id=${usuario.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Estás seguro de que deseas eliminar este entrenador de forma permanente?');">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash3-fill"></i> Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="4" class="text-center py-4 text-muted">No hay usuarios registrados en el sistema.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
