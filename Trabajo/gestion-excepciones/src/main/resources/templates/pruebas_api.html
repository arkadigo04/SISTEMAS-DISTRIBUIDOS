<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Centro de Datos Pokedex</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/International_Pokémon_logo.svg}">

    <!-- 1. TU CSS ORIGINAL (El que le da el estilo guapo) -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">

    <!-- 2. BOOTSTRAP (Necesario solo para que el Chat global se vea bien) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body style="padding-top: 0; background-color: transparent;">

<!-- TU CABECERA ORIGINAL -->
<div class="navbar">
    <img th:src="@{/img/International_Pokémon_logo.svg}" alt="Pokémon Logo" class="banner-logo">
    <h1>Terminal de Gestión Distribuida</h1>
    <a href="/">Cerrar Sesión</a>
</div>

<!-- TU CONTENIDO ORIGINAL -->
<div class="container" style="margin-top: 20px;">
    <div th:if="${error_traducido}" class="alert alert-danger">
        <span th:text="${error_traducido}"></span>
    </div>
    <div th:if="${error_no_critico}" class="alert alert-warning">
        <span th:text="${error_no_critico}"></span>
    </div>
    <div th:if="${exitoGeneral}" class="alert alert-success">
        <span th:text="${exitoGeneral}"></span>
    </div>

    <div th:if="${datosBD}" class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white fw-bold">Ficheros de la Liga: <span th:text="${nombreTabla}"></span></div>
        <table class="poke-table w-100">
            <thead>
            <tr>
                <th>ID</th>
                <th>Entrenador</th>
                <th>Medallas</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="fila : ${datosBD}">
                <td th:text="${fila.id}"></td>
                <td class="fw-bold" th:text="${fila.nombre}"></td>
                <td th:text="${fila.medallas} + ' insignias'"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${equipoPokemon}" class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white fw-bold">Ficha de Equipo: <span th:text="${nombreArchivo}"></span></div>
        <div class="grid-equipo">
            <div th:each="poke : ${equipoPokemon}" class="poke-card-circular">
                <img th:if="${poke.imagen != null}" th:src="${poke.imagen}" class="poke-circle" alt="Img">
                <div th:if="${poke.imagen == null}" class="poke-circle poke-circle-empty">N/A</div>
                <div class="poke-name" th:text="${poke.nombre}"></div>
                <div class="poke-stats-mini">
                    Exp: <span th:text="${poke.experiencia}"></span><br>
                    Alt: <span th:text="${poke.altura}"></span>m
                </div>
            </div>
        </div>
    </div>

    <div th:if="${datosPokemon}" class="card shadow-sm mb-4 text-center p-3">
        <div class="card-header bg-dark text-white fw-bold mb-3" th:text="${datosPokemon.nombre}"></div>
        <img class="poke-circle-large mx-auto d-block mb-3" th:src="${datosPokemon.imagen}" alt="Poke" style="max-width: 150px;">
        <div class="poke-stats-mini">
            <strong>Experiencia:</strong> <span th:text="${datosPokemon.experiencia}"></span> |
            <strong>Altura:</strong> <span th:text="${datosPokemon.altura}"></span>m |
            <strong>Peso:</strong> <span th:text="${datosPokemon.peso}"></span>kg
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white fw-bold">Consultas de Red</div>
        <div class="card-body">
            <form action="/funcional/pokemon" method="get" class="mb-3">
                <input class="input-text w-100 mb-2 p-2 rounded border" type="text" name="nombrePokemon" placeholder="Nombre para búsqueda API">
                <button class="btn btn-primary w-100" type="submit">Sincronizar API</button>
            </form>

            <form action="/funcional/basedatos" method="get">
                <input class="input-text w-100 mb-2 p-2 rounded border" type="text" name="nombreTabla" placeholder="Tabla (entrenadores)">
                <button class="btn btn-secondary w-100" type="submit">Consultar PostgreSQL</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-danger text-white fw-bold">Sistema de Archivos y Tests</div>
        <div class="card-body">
            <form action="/funcional/archivo" method="get" class="mb-3">
                <input class="input-text w-100 mb-2 p-2 rounded border" type="text" name="nombreArchivo" placeholder="Archivo (ej: equipo)">
                <button class="btn btn-danger w-100" type="submit">Cargar Informe TXT</button>
            </form>

            <form action="/funcional/simular-error" method="get">
                <select class="form-select mb-2" name="codigo">
                    <option value="200">Estado: OK (200)</option>
                    <option value="400">Estado: BAD REQUEST (400)</option>
                    <option value="401">Estado: UNAUTHORIZED (401)</option>
                    <option value="404">Estado: NOT FOUND (404)</option>
                    <option value="500">Estado: CRITICAL ERROR (500)</option>
                </select>
                <button class="btn btn-dark w-100" type="submit">Simular Excepción</button>
            </form>
        </div>
    </div>

</div>

<!-- Scripts de Bootstrap para que el chat lateral funcione -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- INYECTAMOS LOS WIDGETS GLOBALES (Música en bucle, Oak y Chat) -->
<div th:replace="~{fragmentos :: widgets}"></div>

</body>
</html>
